<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<title>BattleSim</title>
<link rel="stylesheet" href="popup.css" />
</head>
<body>
<header>
  <h1>BattleSim</h1>
</header>

<main>
  <section id="stuff-status" class="status">Détection du stuff…</section>

  <div id="manual-stuff-box" hidden>
    <label for="stuff-json">Stuff (JSON dofusbook.net)</label>
    <textarea id="stuff-json" rows="5" placeholder="Va sur ta page de stuff dofusbook.net, ou colle le JSON ici"></textarea>
    <button id="paste-btn" class="secondary" type="button">📋 Coller depuis le presse-papier</button>
  </div>

  <label for="monster-link">Lien monstre (dofensive.com)</label>
  <input type="text" id="monster-link" placeholder="https://dofensive.com/fr/monster/..." />
  <p id="monster-status" class="status" hidden></p>

  <label for="ap-override">PA/tour (optionnel)</label>
  <input type="number" id="ap-override" min="1" placeholder="auto" />

  <label for="pv-override">PV réels (optionnel, fiche perso en jeu)</label>
  <input type="number" id="pv-override" min="1" placeholder="ex : 4300" />

  <button id="submit-btn">Calculer</button>
  <p id="error" class="error" hidden></p>

  <section id="results" hidden></section>
</main>

<script src="popup.js"></script>
</body>
</html>
